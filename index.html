<style id="app-style">:root{
  --bg:#E6ECE9; --surface:#FFFFFF; --surface-2:#F3F6F4; --ink:#15201C; --muted:#5A6A64;
  --line:#CAD5D0; --accent:#0B6E4F; --accent-ink:#FFFFFF; --accent-soft:#D6EDE4;
  --danger:#A3321A; --danger-soft:#FBE7E1; --wa:#25D366; --wa-ink:#062B17; --ring:rgba(0,0,0,.06);
  --radius-lg:22px; --radius:14px; --radius-sm:10px;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --ui:"Instrument Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1412; --surface:#16201C; --surface-2:#1C2824; --ink:#E3ECE8; --muted:#94A49E;
    --line:#2B3934; --accent:#45C79B; --accent-ink:#04241A; --accent-soft:#183A2F;
    --danger:#FF9C85; --danger-soft:#3A1E17; --ring:rgba(255,255,255,.45); color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#16201C; --surface-2:#1C2824; --ink:#E3ECE8; --muted:#94A49E;
  --line:#2B3934; --accent:#45C79B; --accent-ink:#04241A; --accent-soft:#183A2F;
  --danger:#FF9C85; --danger-soft:#3A1E17; --ring:rgba(255,255,255,.45); color-scheme: dark;
}
*{box-sizing:border-box}
